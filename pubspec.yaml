name: cineseed_workspace
publish_to: none

environment:
  sdk: ^3.8.0

# One resolution + one pubspec.lock for every package. The frontend is a
# Flutter package, so resolve with `flutter pub get` (plain `dart pub get`
# fails without the Flutter SDK).
workspace:
  - shared
  - backend
  - frontend
  - packages/hls_remux

# Forks adding HLS subtitle + audio-track selection (branch feat/audio-tracks).
# Pinned to commits for reproducible builds. For local fast iteration, swap a
# given entry for a `path:` dependency on a local checkout of the fork.
# A package may be overridden only once per workspace, so all overrides live here.
dependency_overrides:
  # Upstream master at the merge of fluttercommunity/chewie#973 (desktop bar's
  # right-hand controls pinned right). Pinned on upstream, not the fork: the
  # PR branch was deleted after the merge and its commit stopped resolving.
  # Back to pub.dev once it's released.
  chewie:
    git:
      url: https://github.com/fluttercommunity/chewie.git
      ref: 9345d9d799fe561ab9f63b5039c7b34e56b118b2
  video_player_web_hls:
    git:
      url: https://github.com/Ortes/video_player_web_hls.git
      ref: 01dec97cb7347dd745b74e3ae71c1b0534771a04
