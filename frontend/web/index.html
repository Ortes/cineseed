<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Cineseed — search, download and stream your media library.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="cineseed">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>cineseed</title>
  <link rel="manifest" href="manifest.json">

  <!-- hls.js: enables HLS (.m3u8) playback via video_player_web_hls on
       browsers without native HLS (Chrome/Firefox). Vendored locally. -->
  <script src="hls.min.js"></script>

  <!-- Google Cast: __onGCastApiAvailable must be defined before the SDK loads. -->
  <script>
    window['__onGCastApiAvailable'] = function(isAvailable) {
      if (!isAvailable) return;
      cast.framework.CastContext.getInstance().setOptions({
        receiverApplicationId: chrome.cast.media.DEFAULT_MEDIA_RECEIVER_APP_ID,
        autoJoinPolicy: chrome.cast.AutoJoinPolicy.ORIGIN_SCOPED,
      });
    };

    window.requestCastSession = function() {
      cast.framework.CastContext.getInstance().requestSession();
    };

    window.castHls = function(url, title) {
      var session = cast.framework.CastContext.getInstance().getCurrentSession();
      if (!session) return;
      var mediaInfo = new chrome.cast.media.MediaInfo(url, 'application/x-mpegURL');
      mediaInfo.streamType = chrome.cast.media.StreamType.BUFFERED;
      if (title) {
        var meta = new chrome.cast.media.GenericMediaMetadata();
        meta.title = title;
        mediaInfo.metadata = meta;
      }
      session.loadMedia(new chrome.cast.media.LoadRequest(mediaInfo));
    };

    window.getCastState = function() {
      try {
        return cast.framework.CastContext.getInstance().getCastState();
      } catch (e) { return 'NO_DEVICES_AVAILABLE'; }
    };

    window.isCastAvailable = function() {
      try {
        var s = cast.framework.CastContext.getInstance().getCastState();
        return s !== 'NO_DEVICES_AVAILABLE';
      } catch (e) { return false; }
    };
  </script>
  <script src="https://www.gstatic.com/cv/js/sender/v1/cast_sender.js?loadCastFramework=1"></script>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
