name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # deploy/Dockerfile is the single source of truth for the Flutter version.
      - id: flutter
        run: echo "version=$(sed -n 's/^ARG FLUTTER_VERSION=//p' deploy/Dockerfile)" >> "$GITHUB_OUTPUT"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ steps.flutter.outputs.version }}
          channel: stable
          cache: true

      # Some streaming tests drive real ffmpeg/ffprobe.
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg

      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: dart analyze --fatal-infos shared backend packages/cineseed_streaming
      - run: flutter analyze
        working-directory: frontend
      - run: dart test
        working-directory: backend
      - run: dart test
        working-directory: packages/cineseed_streaming
      # The frontend imports web-only libraries, so its tests run in Chrome.
      - run: flutter test --platform chrome
        working-directory: frontend

  # Multi-arch image: built on every run, published on pushes. Tags: sha-<7>
  # and edge from main; X.Y.Z, X.Y and latest from a vX.Y.Z tag.
  image:
    needs: [test, gitleaks]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.img.outputs.name }}:sha-${{ steps.img.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: img
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.img.outputs.name }}
          flavor: latest=false
          tags: |
            type=sha,prefix=sha-,format=short
            type=edge,branch=main
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      # The build stage runs natively and cross-compiles; only the arm64
      # runtime stage's apt-get needs emulation.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: github.event_name == 'push'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Hands the new image to a deploy workflow in another (private) repo, so no
  # host details live here. Set the DEPLOY_REPO variable (owner/repo) and a
  # DEPLOY_TRIGGER_TOKEN secret allowed to dispatch there; unset = no deploy.
  deploy:
    needs: image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.DEPLOY_REPO != ''
    runs-on: ubuntu-latest
    steps:
      - run: >-
          gh api "repos/${{ vars.DEPLOY_REPO }}/dispatches"
          -f event_type=deploy
          -f "client_payload[image]=${{ needs.image.outputs.tag }}"
          -f "client_payload[sha]=${{ github.sha }}"
        env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}

  gitleaks:
    runs-on: ubuntu-latest
    # On PRs the action lists the PR's commits (pulls API) to scan only those.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
