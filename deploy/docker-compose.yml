# Cineseed + Caddy (TLS) + Transmission on one host.
#
#   cd deploy && cp ../.env.example .env   # fill it in, set CINESEED_DOMAIN
#   docker compose up -d
#
# Everything host-specific comes from .env (compose reads it for ${…} too):
#   CINESEED_IMAGE  image to run (default: the latest release)
#   CINESEED_DATA   host dir for downloads + Transmission's config (./data)
#   PUID / PGID     user Transmission writes files as (1000)
# A layout this file can't express (e.g. an rclone FUSE mount) goes in a
# docker-compose.override.yml next to it, which compose merges in on its own.
#
# network_mode=host so the backend reaches Transmission on localhost. Both
# containers mount the downloads at the same path, because the backend opens
# files at the path Transmission reports.

services:
  cineseed:
    image: ${CINESEED_IMAGE:-ghcr.io/ortes/cineseed:latest}
    restart: unless-stopped
    network_mode: host
    env_file: .env
    volumes:
      - ${CINESEED_DATA:-./data}/downloads:/downloads

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    # .env provides CINESEED_DOMAIN, which the Caddyfile reads.
    env_file: .env
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config

  # Transmission stays on the default bridge network: RPC is only reachable
  # from the host (the backend runs with network_mode=host), and the peer
  # port 51413 MUST be published tcp+udp — without it the client is not
  # connectable and seeding upload stays near zero. Its default download
  # dirs are /downloads/complete and /downloads/incomplete.
  transmission:
    image: lscr.io/linuxserver/transmission:latest
    restart: unless-stopped
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TZ:-Etc/UTC}
    ports:
      # RPC — must match TRANSMISSION_URL in .env.
      - "127.0.0.1:9091:9091"
      - "51413:51413"
      - "51413:51413/udp"
    volumes:
      - ${CINESEED_DATA:-./data}/transmission:/config
      - ${CINESEED_DATA:-./data}/downloads:/downloads

volumes:
  caddy_data:
  caddy_config:
